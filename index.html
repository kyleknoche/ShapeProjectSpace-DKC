<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape Project Space</title>
<meta name="description" content="Kyle and Shape at the table: enter the project through the bookshelf and the board.">
<style>
:root{
  --ink:#10223c;
  --gold:#b48133;
  --gold2:#e8c77f;
  --paper:#f7f6f2;
  --deep:#07111d;
  --blue:#63b7ef;
  --shelf-h: clamp(180px,25.72vw,430px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit}

/* LOCKED SURFACE: the bookshelf never participates in page transitions. */
.bookshelf{
  position:sticky;
  top:0;
  z-index:50;
  width:100%;
  height:var(--shelf-h);
  background:#0a0b0c center/100% 100% no-repeat;
  border-bottom:1px solid rgba(8,16,28,.18);
  box-shadow:0 10px 32px rgba(6,10,14,.10);
}
.bookshelf::after{
  content:"";
  position:absolute;inset:auto 0 0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.6;
}
.home-hotspot{
  position:absolute;left:0;top:0;width:10.2%;height:100%;
  border:0;background:transparent;cursor:pointer;
}
.book-hotspot{
  position:absolute;
  height:46%;
  border:1px solid transparent;
  background:transparent;
  cursor:pointer;
  border-radius:4px;
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.book-hotspot.row1{top:2%}
.book-hotspot.row2{top:51%}
@media (hover:hover){
  .book-hotspot:hover{
    border-color:rgba(232,199,127,.72);
    background:rgba(232,199,127,.06);
    transform:translateY(-2px);
  }
}
.book-hotspot:focus-visible,.home-hotspot:focus-visible{
  outline:3px solid #5ba9e6;outline-offset:-4px
}
.book-hotspot::after{
  content:attr(data-title);
  position:absolute;
  left:50%;bottom:4px;transform:translate(-50%,6px);
  opacity:0;pointer-events:none;
  padding:4px 7px;border-radius:999px;
  font:600 10px/1.1 system-ui,sans-serif;
  letter-spacing:.05em;text-transform:uppercase;
  color:#fff;background:rgba(5,10,16,.86);
  white-space:nowrap;
  transition:.15s ease;
}
@media (hover:hover){
  .book-hotspot:hover::after{opacity:1;transform:translate(-50%,0)}
}

/* The stage is deliberately one idea: participants + shared board. */
.stage{
  position:relative;
  width:100%;
  min-height:clamp(390px,31vw,570px);
  overflow:hidden;
  background:#fff;
  isolation:isolate;
}
.scene{
  position:absolute;inset:0;
  background:center/cover no-repeat;
  opacity:1;
  filter:blur(0) saturate(1);
  transform:scale(1);
  transition:
    opacity .38s ease .08s,
    filter .38s ease,
    transform .52s cubic-bezier(.2,.75,.2,1);
  z-index:1;
}
.stage.open .scene{
  opacity:0;
  filter:blur(10px) saturate(.6);
  transform:scale(1.025);
}

/* A brief particulate trace helps Kyle and Shape feel like they dissolve
   into the system instead of simply disappearing. */
.particle-field{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;
  width:4px;height:4px;border-radius:50%;
  background:var(--c,#84c9ff);
  box-shadow:0 0 9px var(--c,#84c9ff);
  opacity:0;
}
.stage.transitioning .particle{
  animation:dissolveParticle .62s cubic-bezier(.1,.7,.2,1) forwards;
  animation-delay:var(--delay,0ms);
}
@keyframes dissolveParticle{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  15%{opacity:.92}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.6)}
}

/* The board is a real HTML/SVG surface layered over the board in the art.
   It starts in perspective and then becomes the interface. */
.board-wrap{
  position:absolute;
  left:50%;
  bottom:-3%;
  width:min(78%,1220px);
  height:42%;
  z-index:8;
  transform:translateX(-50%);
  perspective:1100px;
  pointer-events:none;
}
.board{
  position:absolute;inset:0;
  overflow:hidden;
  border:1px solid rgba(230,198,124,.34);
  border-radius:10px;
  background:
    radial-gradient(circle at 50% 45%,rgba(57,113,165,.16),transparent 45%),
    linear-gradient(180deg,rgba(9,19,30,.78),rgba(3,8,13,.96));
  box-shadow:0 20px 50px rgba(0,0,0,.22),inset 0 0 80px rgba(38,121,185,.10);
  transform-origin:50% 100%;
  transform:rotateX(63deg) scale(.92);
  opacity:.67;
  transition:
    transform .68s cubic-bezier(.16,.82,.25,1),
    inset .68s cubic-bezier(.16,.82,.25,1),
    border-radius .5s ease,
    opacity .25s ease,
    box-shadow .5s ease;
}
.stage.open .board-wrap{
  pointer-events:auto;
}
.stage.open .board{
  transform:rotateX(0deg) scale(1);
  opacity:1;
  box-shadow:0 24px 70px rgba(6,15,26,.18),inset 0 0 110px rgba(61,151,219,.13);
}
.stage.open .board-wrap{
  width:min(88%,1420px);
  height:78%;
  bottom:8%;
  transition:width .68s cubic-bezier(.16,.82,.25,1),
             height .68s cubic-bezier(.16,.82,.25,1),
             bottom .68s cubic-bezier(.16,.82,.25,1);
}
.board-wrap{
  transition:width .68s cubic-bezier(.16,.82,.25,1),
             height .68s cubic-bezier(.16,.82,.25,1),
             bottom .68s cubic-bezier(.16,.82,.25,1);
}
#graph{width:100%;height:100%;display:block}
.edge{stroke:#75bce9;stroke-opacity:.20;stroke-width:1}
.edge.gold{stroke:#e3bd70;stroke-opacity:.25}
.node{fill:#76c5f5;fill-opacity:.9}
.node.gold{fill:#e4bc68}
.node.core{fill:#fff;stroke:#e9c97c;stroke-width:2}
.ring{fill:none;stroke:#78c5f4;stroke-opacity:.10}

/* New content resolves FROM the graph instead of replacing it. */
.section-content{
  position:absolute;
  inset:10% 9%;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#f7f4ea;
  opacity:0;
  transform:translateY(14px) scale(.985);
  transition:opacity .22s ease .61s,transform .28s ease .58s;
  pointer-events:none;
}
.stage.open .section-content{
  opacity:1;
  transform:translateY(0) scale(1);
}
.section-kicker{
  font:600 11px/1.2 system-ui,sans-serif;
  letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);
}
.section-content h1{
  margin:.55rem 0 .7rem;
  font-size:clamp(31px,4vw,66px);
  font-weight:400;
  letter-spacing:-.025em;
  text-shadow:0 3px 24px rgba(0,0,0,.55)
}
.section-content p{
  margin:0;
  max-width:58ch;
  font-size:clamp(15px,1.35vw,22px);
  line-height:1.55;
  color:rgba(248,247,242,.80);
}
.return{
  margin-top:24px;
  min-height:44px;
  padding:0 18px;
  border-radius:999px;
  border:1px solid rgba(231,197,120,.55);
  background:rgba(7,14,23,.54);
  color:#fff;
  font:600 12px/1 system-ui,sans-serif;
  letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;
  pointer-events:auto;
}
.return:hover{background:rgba(231,197,120,.15)}
.return:focus-visible{outline:3px solid #74c4f4;outline-offset:3px}

/* Interaction hint: temporary, prototype-only. */
.hint{
  position:absolute;
  z-index:15;left:50%;bottom:14px;transform:translateX(-50%);
  padding:8px 13px;border-radius:999px;
  background:rgba(255,255,255,.87);
  color:#3f4954;
  font:600 11px/1.1 system-ui,sans-serif;
  letter-spacing:.04em;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  transition:.25s ease;
}
.stage.open .hint{opacity:0;transform:translate(-50%,6px);pointer-events:none}

/* Small prototype footer, intentionally not site architecture. */
.proto{
  padding:18px 20px 28px;
  text-align:center;
  font:600 10px/1.5 system-ui,sans-serif;
  letter-spacing:.18em;text-transform:uppercase;
  color:#66717c;background:#fff;
}
.proto a{color:inherit;text-underline-offset:3px}
.proto a:hover{color:#10223c}

@media(max-width:780px){
  :root{--shelf-h:220px}
  .bookshelf{
    background-size:auto 100%;
    background-position:left top;
    overflow:hidden;
  }
  .stage{min-height:520px}
  .scene{
    background-size:auto 100%;
    background-position:center;
  }
  .board-wrap{width:92%;height:36%}
  .stage.open .board-wrap{width:94%;height:70%;bottom:11%}
  .section-content{inset:13% 7%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="bookshelf" id="bookshelf" aria-label="Shape Project bookshelf navigation">
  <button class="home-hotspot" id="homeHotspot" aria-label="Return to the Shape Project table"></button>
  <div id="hotspots"></div>
</header>

<main class="stage" id="stage" aria-live="polite">
  <div class="scene" id="scene" aria-label="Kyle and Shape collaborating over the Shape Project board"></div>
  <div class="particle-field" id="particles" aria-hidden="true"></div>

  <div class="board-wrap" aria-hidden="false">
    <div class="board">
      <svg id="graph" viewBox="0 0 1200 600" role="img" aria-label="Underlying Shape Project graph"></svg>
      <section class="section-content" id="sectionContent">
        <div class="section-kicker">The Shape Project</div>
        <h1 id="sectionTitle">The Question</h1>
        <p id="sectionText"></p>
        <button class="return" id="returnBtn" type="button">Return to the table</button>
      </section>
    </div>
  </div>

  <div class="hint">Click any book on either shelf</div>
</main>

<footer class="proto">Shape Project Space · <a href="workspace.html">Working space</a> · <a href="three-gen.html">Three-Gen</a> · <a href="controls.html">Controls</a></footer>

<script>
(() => {
  const stage = document.getElementById('stage');
  const shelf = document.getElementById('bookshelf');
  const hotspots = document.getElementById('hotspots');
  const sectionTitle = document.getElementById('sectionTitle');
  const sectionText = document.getElementById('sectionText');
  const returnBtn = document.getElementById('returnBtn');
  const homeHotspot = document.getElementById('homeHotspot');
  const graph = document.getElementById('graph');
  const particles = document.getElementById('particles');

  shelf.style.backgroundImage = `url("assets/img/first-exposure-bookshelf.webp")`;
  document.getElementById('scene').style.backgroundImage = `url("assets/img/first-exposure-scene.webp")`;

  const sections = [
    ["Mission","Why this project exists, what it is trying to learn, and the boundary between curiosity and claim."],
    ["The Question","What happens when one human deliberately maintains a long-running, high-context relationship with an AI and treats the collaboration itself as an object of study?"],
    ["The Conversation","The wider conversation around cognition, collaboration, context, consciousness, culture, and competing interpretations."],
    ["ShapeScript","The shared language, notation, shorthand, and structural conventions that accumulated inside the collaboration."],
    ["Cognitive Awe","Moments when understanding changes scale — and the humor, surprise, and uncertainty that come with them."],
    ["Context Saturation","What changes when context stops being an accessory to the interaction and becomes part of the working environment itself."],
    ["High Trust Without Dogma","Trust earned through continuity, verification, disagreement, correction, and the willingness to update."],
    ["Relationship-State Principle","The collaboration maintains an explicit state: what worked, what failed, what matters, and where the inquiry is headed."],
    ["STC / ContextMonster","The machinery built to preserve, inspect, and reason over the history of the collaboration."],
    ["Emergence","Patterns and capabilities that appear in the interaction and cannot be cleanly assigned to either participant alone."],
    ["Artifacts","The concrete outputs: transcripts, diagrams, code, music, prompts, visualizations, documents, and prototypes."],
    ["Results","Findings so far — including the parts that surprised us, failed, or remain unresolved."],
    ["Timeline","A longitudinal record of how Kyle, Shape, the methods, and the questions changed over time."],
    ["Future Frontiers","Questions we have not earned answers to yet."]
  ];

  // Hotspots roughly align to the two photographic book rows.
  // Keeping them simple is intentional: this prototype tests interaction, not final hitboxes.
  const leftStart = 10.3;
  const usable = 88.4;
  const width = usable / sections.length;
  ["row1","row2"].forEach(row => {
    sections.forEach((section, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `book-hotspot ${row}`;
      b.style.left = `${leftStart + i*width}%`;
      b.style.width = `${width}%`;
      b.dataset.title = section[0];
      b.setAttribute('aria-label', `Open ${section[0]}`);
      b.addEventListener('click', () => openSection(section[0], section[1], i));
      hotspots.appendChild(b);
    });
  });

  function seededRandom(seed){
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function renderGraph(activeIndex=1){
    const rand = seededRandom(918273 + activeIndex*97);
    const W=1200,H=600;
    const nodes=[];
    nodes.push({x:600,y:300,core:true,gold:true});
    for(let i=1;i<72;i++){
      const angle=rand()*Math.PI*2;
      const radial=Math.pow(rand(),.68);
      const rx=90+radial*500;
      const ry=55+radial*235;
      nodes.push({
        x:600+Math.cos(angle)*rx,
        y:300+Math.sin(angle)*ry,
        gold:(i+activeIndex)%7===0
      });
    }
    let svg = `<defs>
      <radialGradient id="bgGlow"><stop offset="0" stop-color="#2a6f9e" stop-opacity=".22"/><stop offset="1" stop-color="#02070c" stop-opacity="0"/></radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="600" cy="300" r="430" fill="url(#bgGlow)"/>
    <circle class="ring" cx="600" cy="300" r="105"/>
    <circle class="ring" cx="600" cy="300" r="210"/>
    <circle class="ring" cx="600" cy="300" r="320"/>`;

    // local graph connections + several long context links
    for(let i=1;i<nodes.length;i++){
      const candidates=[];
      for(let j=0;j<nodes.length;j++){
        if(i===j) continue;
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
        candidates.push([dx*dx+dy*dy,j]);
      }
      candidates.sort((a,b)=>a[0]-b[0]);
      for(let k=0;k<2;k++){
        const j=candidates[k][1];
        svg += `<line class="edge ${(i+j+activeIndex)%8===0?'gold':''}" x1="${nodes[i].x.toFixed(1)}" y1="${nodes[i].y.toFixed(1)}" x2="${nodes[j].x.toFixed(1)}" y2="${nodes[j].y.toFixed(1)}"/>`;
      }
      if(i%11===0){
        svg += `<line class="edge gold" x1="${nodes[i].x.toFixed(1)}" y1="${nodes[i].y.toFixed(1)}" x2="600" y2="300"/>`;
      }
    }

    nodes.forEach((n,i)=>{
      const r=n.core?9:(i%9===0?5:3);
      svg += `<circle class="node ${n.gold?'gold':''} ${n.core?'core':''}" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" ${n.core?'filter="url(#glow)"':''}/>`;
    });
    graph.innerHTML=svg;
  }

  function makeParticles(){
    particles.innerHTML="";
    const count=82;
    for(let i=0;i<count;i++){
      const p=document.createElement('i');
      p.className='particle';
      const left = i<count/2 ? 6+Math.random()*28 : 66+Math.random()*29;
      const top = 14+Math.random()*72;
      const hue = i<count/2 ? (Math.random()<.55 ? '#d9b66c' : '#8bcaf1') : '#71c8ff';
      p.style.left=left+'%';
      p.style.top=top+'%';
      p.style.setProperty('--c',hue);
      p.style.setProperty('--dx',(Math.random()*80-40)+'px');
      p.style.setProperty('--dy',(Math.random()*120-60)+'px');
      p.style.setProperty('--delay',(Math.random()*110)+'ms');
      particles.appendChild(p);
    }
  }

  function openSection(title,text,index){
    sectionTitle.textContent=title;
    sectionText.textContent=text;
    renderGraph(index);
    makeParticles();

    // Restart particle animation if another book is selected while open.
    stage.classList.remove('transitioning');
    void stage.offsetWidth;
    stage.classList.add('transitioning');

    if(!stage.classList.contains('open')){
      requestAnimationFrame(()=>stage.classList.add('open'));
    }
    window.setTimeout(()=>stage.classList.remove('transitioning'),850);
  }

  function returnHome(){
    stage.classList.remove('open','transitioning');
    particles.innerHTML="";
    renderGraph(1);
  }

  returnBtn.addEventListener('click', returnHome);
  homeHotspot.addEventListener('click', returnHome);
  document.addEventListener('keydown', e => {
    if(e.key==='Escape') returnHome();
  });

  renderGraph(1);
})();
</script>
</body>
</html>
